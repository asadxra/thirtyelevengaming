<!doctype html><html><head><meta charset="utf-8"><title>One More Game</title>
<style>
html,body{margin:0;background:#0b0d16}
svg{display:block;width:100vw;max-width:540px;margin:auto}
text{font-family:'Bebas Neue','Oswald','Impact',sans-serif;font-weight:700}
</style></head><body>
<svg id="s" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sk1" offset="0"/><stop id="sk2" offset="1"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7fd6ff" stop-opacity=".55"/><stop offset="1" stop-color="#7fd6ff" stop-opacity="0"/></radialGradient>
 <clipPath id="win"><rect x="120" y="560" width="300" height="300" rx="8"/></clipPath>
</defs>
<rect id="bg" width="1080" height="1920" fill="#1d2440"/>
<!-- wall stripes -->
<g opacity=".06" fill="#fff"><rect y="500" width="1080" height="4"/><rect y="800" width="1080" height="4"/><rect y="1100" width="1080" height="4"/></g>
<!-- window -->
<rect x="104" y="544" width="332" height="332" rx="14" fill="#2c3660"/>
<g clip-path="url(#win)"><rect x="120" y="560" width="300" height="300" fill="url(#sky)"/>
 <circle id="moon" cx="330" cy="640" r="38" fill="#f4f1d0"/>
 <circle id="sun" cx="270" cy="980" r="50" fill="#ffd36b"/>
 <g id="stars" fill="#fff"><circle cx="160" cy="600" r="4"/><circle cx="220" cy="680" r="3"/><circle cx="390" cy="760" r="3"/><circle cx="180" cy="790" r="4"/></g></g>
<rect x="264" y="560" width="12" height="300" fill="#2c3660"/><rect x="120" y="704" width="300" height="12" fill="#2c3660"/>
<!-- clock -->
<circle cx="860" cy="640" r="92" fill="#f2f2f2" stroke="#2c3660" stroke-width="14"/>
<line id="hh" x1="860" y1="640" x2="860" y2="590" stroke="#222" stroke-width="12" stroke-linecap="round"/>
<line id="mh" x1="860" y1="640" x2="860" y2="570" stroke="#e5484d" stroke-width="7" stroke-linecap="round"/>
<circle cx="860" cy="640" r="9" fill="#222"/>
<!-- floor -->
<rect y="1560" width="1080" height="360" fill="#151a30"/>
<!-- screen glow -->
<ellipse id="glowE" cx="560" cy="1180" rx="420" ry="300" fill="url(#glow)"/>
<!-- desk + monitor -->
<rect x="420" y="1000" width="300" height="190" rx="14" fill="#11141f"/>
<rect id="scr" x="436" y="1016" width="268" height="158" rx="6" fill="#58c4f5"/>
<rect x="555" y="1190" width="30" height="70" fill="#11141f"/>
<rect x="340" y="1260" width="460" height="26" rx="6" fill="#3a2f2a"/>
<rect x="370" y="1286" width="22" height="280" fill="#3a2f2a"/><rect x="748" y="1286" width="22" height="280" fill="#3a2f2a"/>
<!-- friend (white, bun) -->
<g id="friend">
 <ellipse cx="880" cy="1565" rx="90" ry="14" fill="#000" opacity=".25"/>
 <g stroke="#f4f4f4" stroke-width="30" stroke-linecap="round" fill="none">
  <path d="M880 1200 L880 1400"/><path d="M880 1400 L845 1555"/><path d="M880 1400 L915 1555"/>
  <path id="fArm" d="M880 1250 L820 1340"/><path d="M880 1250 L940 1340"/></g>
 <circle cx="880" cy="975" r="30" fill="#f4f4f4"/>
 <circle cx="880" cy="1090" r="115" fill="#f4f4f4"/>
 <ellipse cx="830" cy="1120" rx="18" ry="11" fill="#ff9aa8" opacity=".7"/>
 <g id="fEyes" fill="#222"><circle cx="845" cy="1080" r="12"/><circle cx="915" cy="1080" r="12"/></g>
 <path id="fMouth" d="M855 1130 Q880 1155 905 1130" stroke="#222" stroke-width="8" fill="none" stroke-linecap="round"/>
</g>
<!-- me (teal) -->
<g id="me">
 <ellipse cx="250" cy="1565" rx="90" ry="14" fill="#000" opacity=".25"/>
 <g stroke="#6fd8c0" stroke-width="30" stroke-linecap="round" fill="none">
  <path d="M250 1220 L250 1410"/><path d="M250 1410 L215 1555"/><path d="M250 1410 L285 1555"/>
  <path d="M250 1270 L330 1320"/><path d="M250 1270 L170 1320 "/></g>
 <rect x="300" y="1300" width="70" height="40" rx="18" fill="#222"/>
 <g id="head">
  <circle cx="250" cy="1100" r="125" fill="#6fd8c0"/>
  <g id="mEyes"><circle cx="210" cy="1085" r="13" fill="#222"/><circle cx="290" cy="1085" r="13" fill="#222"/></g>
  <g id="lids" fill="#6fd8c0"><rect id="l1" x="190" y="1060" width="40" height="0"/><rect id="l2" x="270" y="1060" width="40" height="0"/></g>
  <g id="bags" stroke="#3f9a86" stroke-width="5" fill="none" opacity="0"><path d="M195 1112 Q210 1122 225 1112"/><path d="M275 1112 Q290 1122 305 1112"/></g>
  <path id="mMouth" d="M220 1140 Q250 1170 280 1140" stroke="#222" stroke-width="8" fill="none" stroke-linecap="round"/>
 </g>
</g>
<!-- caption -->
<text x="540" y="230" text-anchor="middle" font-size="110" fill="#fff" textLength="940" lengthAdjust="spacingAndGlyphs">"ONE MORE <tspan fill="#ffd34d">GAME</tspan>"</text>
<rect x="240" y="290" width="600" height="90" rx="45" fill="#11141f"/>
<text id="cnt" x="540" y="357" text-anchor="middle" font-size="64" fill="#fff">GAMES PLAYED: 1</text>
<rect x="390" y="410" width="300" height="80" rx="40" fill="#ffd34d" stroke="#11141f" stroke-width="6"/>
<text id="time" x="540" y="472" text-anchor="middle" font-size="62" fill="#11141f">10:00 PM</text>
<!-- bubble -->
<g id="bub" opacity="0"><rect id="bubR" x="0" y="0" width="10" height="110" rx="55" fill="#fff" stroke="#11141f" stroke-width="8"/>
 <path id="bubT" d="" fill="#fff" stroke="#11141f" stroke-width="8" stroke-linejoin="round"/>
 <text id="bubX" x="0" y="78" text-anchor="middle" font-size="70" fill="#11141f"></text></g>
</svg>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const mix=(a,b,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lines=[[0.6,2.6,'friend','ONE MORE GAME?'],[1.4,2.6,'me','SURE!'],[5.6,7.4,'friend','...ONE MORE?'],[6.4,7.4,'me','OKAY.'],[8.3,10,'me','THE SUN IS UP.']];
function bubble(t){
 let L=null;for(const l of lines) if(t>=l[0]&&t<l[1]) L=l;
 const b=$('bub'); if(!L){b.setAttribute('opacity',0);return}
 const k=ease(cl((t-L[0])/.2)); b.setAttribute('opacity',k);
 $('bubX').textContent=L[3]; const w=L[3].length*40+90, cx=L[2]=="me"?360:720, y=760;
 $('bubR').setAttribute('x',cx-w/2);$('bubR').setAttribute('y',y);$('bubR').setAttribute('width',w);
 $('bubX').setAttribute('x',cx);$('bubX').setAttribute('y',y+80);
 const tx=L[2]=='me'?260:860, ty=L[2]=='me'?960:960;
 $('bubT').setAttribute('d',`M${cx-25} ${y+104} L${tx} ${ty} L${cx+25} ${y+104}`);
 b.setAttribute('transform',`translate(${cx} ${y+55}) scale(${.8+.2*k}) translate(${-cx} ${-(y+55)})`);
}
function draw(t){
 const p=ease(cl((t-2.4)/3)), p2=ease(cl((t-7.4)/1)); // night progress, final skip
 const mins=600*0+p*(5*60+47)*.82+p2*(5*60+47)*.18; const total=22*60+mins;
 const h=Math.floor(total/60)%24, m=Math.floor(total%60);
 $('time').textContent=`${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
 $('mh').setAttribute('transform',`rotate(${total*6} 860 640)`);$('hh').setAttribute('transform',`rotate(${total*.5} 860 640)`);
 $('cnt').textContent='GAMES PLAYED: '+(1+Math.floor(p*13+p2*9));
 // sky
 const dawn=ease(cl((t-7.6)/1.2));
 $('sk1').setAttribute('stop-color',mix(mix('#3b3f8f','#0a0d2a',p),'#6a6fd1',dawn));
 $('sk2').setAttribute('stop-color',mix(mix('#c46a8a','#1a1640',p),'#ffb36b',dawn));
 $('moon').setAttribute('cy',640-p*40+dawn*300);$('sun').setAttribute('cy',980-dawn*260);$('stars').setAttribute('opacity',p*(1-dawn));
 $('bg').setAttribute('fill',mix(mix('#1d2440','#121629',p),'#2a3358',dawn));
 // screen flicker
 $('scr').setAttribute('fill',['#58c4f5','#7fe0a0','#f5a958','#c08bf5'][Math.floor(t*3)%4]);
 $('glowE').setAttribute('opacity',.7+.3*Math.sin(t*20));
 // me tiredness
 const tired=cl(p*.75+p2*.25);
 $('l1').setAttribute('height',tired*30);$('l2').setAttribute('height',tired*30);
 $('bags').setAttribute('opacity',tired);
 const mc=1140+tired*5, curve=30*(1-tired*1.6);
 $('mMouth').setAttribute('d',`M220 ${mc} Q250 ${mc+curve} 280 ${mc}`);
 const bob=Math.sin(t*6)*6*(1-tired), droop=tired*8;
 $('head').setAttribute('transform',`translate(0 ${bob+droop*3}) rotate(${droop} 250 1220)`);
 // final shock
 if(t>8.3){const s=ease(cl((t-8.3)/.25));$('mEyes').setAttribute('transform',`translate(250 1085) scale(${1+s*.5}) translate(-250 -1085)`);$('l1').setAttribute('height',tired*30*(1-s));$('l2').setAttribute('height',tired*30*(1-s));$('mMouth').setAttribute('d',`M228 1140 Q250 ${1140+30*s} 272 1140 Q250 ${1140-4*s} 228 1140`)}
 else $('mEyes').removeAttribute('transform');
 // friend still fresh
 $('friend').setAttribute('transform',`translate(0 ${Math.sin(t*6+1)*8})`);
 bubble(t);
}
window.draw=draw;
if(!location.search.includes('render')){const t0=performance.now();(function f(){draw(((performance.now()-t0)/1000)%10);requestAnimationFrame(f)})()}
</script></body></html>
